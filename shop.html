<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Division 1 OS | Shop</title>
  <meta name="description" content="Division 1 shop page featuring the current shirt drop.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://js.stripe.com/v3/"></script>
</head>
<body data-page="shop">
  <div class="page-shell">
    <header class="site-header" role="banner">
      <a class="os-title" href="shop.html" aria-label="Division 1 OS shop">Division 1 OS</a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="index.html">Entry</a>
        <a class="is-active" href="shop.html">Shop</a>
        <a href="gallery.html">Gallery</a>
        <a href="socials.html">Socials</a>
      </nav>
    </header>

    <main class="page-main">
      <section class="page-intro shop-intro">
        <p class="eyebrow">Division 1 Shop</p>
      </section>

      <section class="cart-panel" aria-live="polite">
        <div class="cart-panel-header">
          <p class="eyebrow">Cart</p>
          <p class="cart-count"><span data-cart-count>0</span> items</p>
        </div>
        <div class="cart-body">
          <p class="cart-empty" data-cart-empty>Your cart is empty.</p>
          <ul class="cart-items" data-cart-items></ul>
          <p class="cart-total">Total: <strong data-cart-total>$0.00</strong></p>
          <button class="cart-checkout-link" type="button" data-checkout-button>Checkout Cart</button>
        </div>
      </section>

      <section class="checkout-modal" data-checkout-modal hidden>
        <button type="button" class="checkout-cancel" data-checkout-cancel>Cancel</button>
        <form data-shipping-form>
          <p class="eyebrow">Shipping</p>
          <input data-ship-name placeholder="Full name" required />
          <input data-ship-line1 placeholder="Address" required />
          <input data-ship-city placeholder="City" required />
          <input data-ship-state placeholder="State" required />
          <input data-ship-zip placeholder="ZIP" required />
          <button type="submit">Continue to payment</button>
        </form>

        <div data-payment-section hidden>
          <p class="eyebrow">Payment</p>
          <div id="payment-element"></div>
          <button type="button" data-pay-button>Pay now</button>
          <div data-payment-message></div>
        </div>
      </section>


      <section class="product-grid shop-grid" aria-label="Division 1 shirt drop">
        <article class="product-card" data-product-card>
          <p class="product-tag">D1</p>
          <div class="shirt-stage">
            <div class="shirt-display" aria-label="Rock and Roll shirt image">
              <div class="shirt-image-wrap">
                <img class="shirt-image" src="images/shirt1.png" alt="Rock and Roll shirt product image">
              </div>
            </div>
          </div>
          <div class="product-meta">
            <h2>rock &amp; roll</h2>
            <p class="price-text">$40.00</p>
          </div>
          <label class="size-selector">
            <span>Size</span>
            <select data-size-selector aria-label="Select Rock and Roll Shirt size" required>
              <option value="">Select size</option>
              <option value="Small">Small</option>
              <option value="Med">Med</option>
              <option value="Large">Large</option>
              <option value="XL">XL</option>
            </select>
          </label>
          <button class="add-to-cart-button" type="button" data-add-to-cart data-name="Rock &amp; Roll Shirt" data-price="40" data-price-id="price_1TxEKOCPoNR7hDKvvRAcGskj" data-shopify-variant-id="">Add to cart</button>
        </article>
        <article class="product-card" data-product-card>
          <p class="product-tag">D1</p>
          <div class="shirt-stage">
            <div class="shirt-display" aria-label="No Tomorrow shirt image">
              <div class="shirt-image-wrap">
                <img class="shirt-image" src="images/shirt3.png" alt="No Tomorrow shirt product image">
              </div>
            </div>
          </div>
          <div class="product-meta">
            <h2>no tomorrow</h2>
            <p class="price-text">$40.00</p>
          </div>
          <label class="size-selector">
            <span>Size</span>
            <select data-size-selector aria-label="Select No Tomorrow Shirt size" required>
              <option value="">Select size</option>
              <option value="Small">Small</option>
              <option value="Med">Med</option>
              <option value="Large">Large</option>
              <option value="XL">XL</option>
            </select>
          </label>
          <button class="add-to-cart-button" type="button" data-add-to-cart data-name="No Tomorrow Shirt" data-price="40" data-price-id="price_1TxEJqCPoNR7hDKvkVjAPlTO" data-shopify-variant-id="">Add to cart</button>
        </article>
      </section>
    </main>
  </div>
  <aside class="cart-toast" data-cart-toast role="status" aria-live="polite" aria-atomic="true"></aside>
  <script src="script.js" defer></script>
</body>
</html>
